# Demo site of the Léon theme
title: Léon
baseline: A documentation theme for Cecil
description: Léon is a documentation theme for Cecil, with a warm and editorial look.
baseurl: http://localhost:8000/
author:
  name: Cecil
  url: https://cecil.app
# footer icons (and `rel="me"` links of the metatags)
social:
  github:
    url: https://github.com/Cecilapp/theme-leon
  opencollective:
    url: https://opencollective.com/cecil
# `themes/leon` links to the root of this repository (see `link.php`)
theme:
  - leon
  - flexsearch
  - darkmodetoggle
  - pele
language: en
languages:
  - code: en
    name: English
    locale: en_US
  - code: fr
    name: Français
    locale: fr_FR
    # `menus` and `leon` are not merged with the default language: they are repeated in full
    config:
      baseline: Un thème de documentation pour Cecil
      description: Léon est un thème de documentation pour Cecil, à l'allure chaleureuse et éditoriale.
      menus:
        main:
          - id: github
            name: GitHub
            url: https://github.com/Cecilapp/theme-leon
            weight: 10
        footer:
          - id: cecil
            name: Site de Cecil
            url: https://cecil.app
            weight: 10
          - id: themes
            name: Thèmes pour Cecil
            url: https://cecil.app/themes/
            weight: 20
      leon:
        header:
          cta:
            name: Commencer
            url: /docs/getting-started/quickstart/
        github:
          repo: https://github.com/Cecilapp/theme-leon
          path: demo/pages
        footer: 'Léon est un thème libre pour [Cecil](https://cecil.app), publié sous licence MIT.'
        language:
          suggest: true
# Markdown version of pages ("Copy page") and `llms.txt`
output:
  pagetypeformats:
    page: [html, markdown]
    section: [html, markdown]
    homepage: [html, llms]
pages:
  sortby: weight
  pagination:
    enabled: false
menus:
  main:
    - id: github
      name: GitHub
      url: https://github.com/Cecilapp/theme-leon
      weight: 10
  footer:
    - id: cecil
      name: Cecil website
      url: https://cecil.app
      weight: 10
    - id: themes
      name: Themes for Cecil
      url: https://cecil.app/themes/
      weight: 20
leon:
  header:
    cta:
      name: Get started
      url: /docs/getting-started/quickstart/
  github:
    repo: https://github.com/Cecilapp/theme-leon
    path: demo/pages
  footer: 'Léon is a free theme for [Cecil](https://cecil.app), released under the MIT license.'
  language:
    suggest: true
flexsearch:
  sections:
    docs:
      limit: 6
    reference:
      limit: 4
